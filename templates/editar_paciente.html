{% extends "base.html" %}

{% block titulo %}Editar paciente{% endblock %}

{% block conteudo %}

<h2>Editar paciente</h2>

<form method="POST">

    <label for="nome">Nome completo:</label>
    <input type="text" id="nome" name="nome"
           value="{{ paciente.nome }}" required>

    <label for="nascimento">Data de nascimento:</label>
    <input type="date" id="nascimento" name="nascimento"
           value="{{ paciente.nascimento }}" required>

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf"
           value="{{ paciente.cpf }}" required>

    <label for="prioridade">Prioridade:</label>
    <select id="prioridade" name="prioridade">
        {% for opcao in ["Normal", "Preferencial", "Urgente"] %}
        <option value="{{ opcao }}" {% if paciente.prioridade == opcao %}selected{% endif %}>
            {{ opcao }}
        </option>
        {% endfor %}
    </select>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone"
           value="{{ paciente.telefone or '' }}">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email"
           value="{{ paciente.email or '' }}">

    <label for="observacoes">Observações:</label>
    <textarea id="observacoes" name="observacoes">{{ paciente.observacoes or '' }}</textarea>

    <button type="submit">Salvar alterações</button>

</form>

<a href="{{ url_for('pacientes') }}">
    <button type="button">Cancelar</button>
</a>

{% endblock %}
