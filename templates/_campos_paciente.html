{# Campos do formulário de paciente, usados no cadastro e na edição.
   Espera uma variável "dados" (dicionário ou objeto Paciente). #}

<label for="nome">Nome completo:</label>
<input type="text" id="nome" name="nome"
       value="{{ dados.nome or '' }}" required>

<label for="nascimento">Data de nascimento:</label>
<input type="date" id="nascimento" name="nascimento"
       value="{{ dados.nascimento or '' }}" required>

<label for="cpf">CPF:</label>
<input type="text" id="cpf" name="cpf"
       value="{{ (dados.cpf or '')|cpf }}"
       placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>

<label for="prioridade">Prioridade:</label>
<select id="prioridade" name="prioridade">
    {% for opcao in PRIORIDADES %}
    <option value="{{ opcao }}" {% if dados.prioridade == opcao %}selected{% endif %}>
        {{ opcao }}
    </option>
    {% endfor %}
</select>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" name="telefone"
       value="{{ dados.telefone or '' }}">

<label for="email">E-mail:</label>
<input type="email" id="email" name="email"
       value="{{ dados.email or '' }}">

<label for="observacoes">Observações:</label>
<textarea id="observacoes" name="observacoes">{{ dados.observacoes or '' }}</textarea>
