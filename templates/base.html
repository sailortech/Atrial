<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} - Atrial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Atrial</h1>

        <nav>
            <a href="{{ url_for('home') }}"
               class="{% if request.endpoint == 'home' %}ativo{% endif %}">
                Início
            </a>
            <a href="{{ url_for('pacientes') }}"
               class="{% if request.endpoint == 'pacientes' %}ativo{% endif %}">
                Pacientes
            </a>
            <a href="{{ url_for('cadastro_paciente') }}"
               class="{% if request.endpoint == 'cadastro_paciente' %}ativo{% endif %}">
                Novo paciente
            </a>
        </nav>
    </header>

    <main>
        {# Mensagens do flash(): aparecem uma vez e somem #}
        {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensagens %}
        <p class="mensagem mensagem-{{ categoria }}">{{ texto }}</p>
        {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>

</body>

</html>
